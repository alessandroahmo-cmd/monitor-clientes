<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semáforo dos Clientes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='1' width='14' height='30' rx='5' fill='%23222'/%3E%3Ccircle cx='16' cy='8' r='4' fill='%23e5484d'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f5b400'/%3E%3Ccircle cx='16' cy='24' r='4' fill='%2330a46c'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f0f1f4; --text:#16181d; --muted:#626873; --line:#e2e4e9;
  --green:#1f9d55; --green-soft:#e3f5ea; --yellow:#c98a00; --yellow-soft:#fdf3d7; --red:#d92d20; --red-soft:#fde7e5;
  --lamp-off:#d9dce1; --housing:#2a2d34; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#181b21; --surface-2:#20242c; --text:#e8eaee; --muted:#9aa1ad; --line:#2a2f38;
  --green:#3ccf7a; --green-soft:#14301f; --yellow:#f5c03b; --yellow-soft:#352a0c; --red:#ff6159; --red-soft:#3a1715;
  --lamp-off:#2c3039; --housing:#0a0b0e; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface-2:#20242c; --text:#e8eaee; --muted:#9aa1ad; --line:#2a2f38;
  --green:#3ccf7a; --green-soft:#14301f; --yellow:#f5c03b; --yellow-soft:#352a0c; --red:#ff6159; --red-soft:#3a1715;
  --lamp-off:#2c3039; --housing:#0a0b0e; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.sub b{color:var(--text);font-weight:600}
.stale{color:var(--red);font-weight:600}
.tools{display:flex;gap:8px;align-items:center}
button,.input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--surface-2)}
.input{cursor:text;width:180px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.sum .dot{width:30px;height:30px;border-radius:50%;flex:none}
.sum .n{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sum .l{color:var(--muted);font-size:13px;display:block;margin-top:4px}
.sum.active{outline:2px solid var(--text);outline-offset:-2px}
.g .dot{background:var(--green);box-shadow:0 0 14px var(--green)}
.y .dot{background:var(--yellow);box-shadow:0 0 14px var(--yellow)}
.r .dot{background:var(--red);box-shadow:0 0 14px var(--red)}
.sum.zero .dot{background:var(--lamp-off);box-shadow:none}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{border-radius:999px;padding:5px 12px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.client{margin-bottom:26px}
.client h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.04em}
.client h2 .mini{display:flex;gap:4px}
.client h2 .mini i{width:9px;height:9px;border-radius:50%;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:14px;box-shadow:var(--shadow);min-width:0}
.card.red{border-color:var(--red);background:linear-gradient(var(--red-soft),var(--surface) 70%)}
.card.yellow{border-color:color-mix(in srgb,var(--yellow) 60%,var(--line))}
.light{background:var(--housing);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px;flex:none;align-self:flex-start}
.lamp{width:20px;height:20px;border-radius:50%;background:var(--lamp-off)}
.card.red .lamp.r{background:var(--red);box-shadow:0 0 10px var(--red)}
.card.yellow .lamp.y{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.card.green .lamp.g{background:var(--green);box-shadow:0 0 10px var(--green)}
.card.red .lamp.r{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.card.red .lamp.r{animation:none}}

.body{min-width:0;flex:1}
.top{display:flex;align-items:center;gap:8px;min-width:0}
.top img{width:18px;height:18px;border-radius:4px;flex:none;object-fit:contain}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;flex:none}
.badge.prod{background:var(--surface-2);color:var(--text)}
.badge.hmg{background:var(--yellow-soft);color:var(--yellow)}
.url{font-size:12.5px;color:var(--muted);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 8px}
.url:hover{text-decoration:underline;color:var(--text)}
.reason{font-size:13px;font-weight:600;margin-bottom:8px}
.green .reason{color:var(--green)} .yellow .reason{color:var(--yellow)} .red .reason{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.stats b{display:block;color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.hist{display:flex;gap:1.5px;height:16px;margin-top:10px;align-items:stretch}
.hist i{flex:1;border-radius:1.5px;min-width:2px}
.hist .g{background:var(--green)} .hist .y{background:var(--yellow)} .hist .r{background:var(--red)} .hist .n{background:var(--lamp-off)}
.histlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{color:var(--muted);font-size:12px;margin-top:30px;text-align:center}
@media (max-width:560px){
  .summary{gap:8px}.sum{padding:10px;gap:8px;flex-direction:column;align-items:flex-start}.sum .dot{width:20px;height:20px}.sum .n{font-size:22px}
  .input{width:100%}.tools{width:100%}.grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Semáforo dos Clientes</h1>
      <div class="sub" id="updated">Carregando…</div>
    </div>
    <div class="tools">
      <input class="input" id="q" type="search" placeholder="Buscar cliente ou link…" aria-label="Buscar">
      <button id="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema">◐</button>
    </div>
  </header>

  <section class="summary">
    <button class="sum g" data-color="green"><span class="dot"></span><span><span class="n" id="n-green">–</span><span class="l">Funcionando</span></span></button>
    <button class="sum y" data-color="yellow"><span class="dot"></span><span><span class="n" id="n-yellow">–</span><span class="l">Atenção</span></span></button>
    <button class="sum r" data-color="red"><span class="dot"></span><span><span class="n" id="n-red">–</span><span class="l">Fora do ar</span></span></button>
  </section>

  <div class="filters" id="envf">
    <button class="chip" data-env="" aria-pressed="true">Todos</button>
    <button class="chip" data-env="Produção" aria-pressed="false">Produção</button>
    <button class="chip" data-env="Homologação" aria-pressed="false">Homologação</button>
  </div>

  <main id="list"><div class="empty">Carregando status…</div></main>
  <footer>Consulta automática a cada ~5 minutos. A página se atualiza sozinha a cada minuto.</footer>
</div>

<script>
const ORDER = {red:0, yellow:1, green:2};
const LABEL = {green:"Funcionando", yellow:"Atenção", red:"Fora do ar"};
const state = {data:null, color:"", env:"", q:""};
try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => {
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "agora há pouco";
  if (s < 3600) return `há ${Math.floor(s/60)} min`;
  if (s < 86400) return `há ${Math.floor(s/3600)} h ${Math.floor(s%3600/60)} min`;
  return `há ${Math.floor(s/86400)} dias`;
};
const fmtTime = iso => new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

function card(s){
  const ssl = s.ssl || {};
  const sslTxt = ssl.days_left != null ? `${ssl.days_left} dias` : (ssl.valid === false ? "inválido" : (s.url.startsWith("https") ? "—" : "sem SSL"));
  const ms = s.error ? "—" : (s.ms >= 1000 ? (s.ms/1000).toFixed(1)+" s" : s.ms+" ms");
  const hist = (s.history || []).slice(-60);
  const pad = Array(Math.max(0, 60 - hist.length)).fill('<i class="n"></i>').join("");
  const bars = pad + hist.map(h => `<i class="${h.c}" title="${esc(fmtTime(h.t))} · ${LABEL[{g:'green',y:'yellow',r:'red'}[h.c]]} · ${h.ms} ms"></i>`).join("");
  const icon = s.icon ? `<img src="${esc(s.icon)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  const down = s.color === "red" && s.down_since ? ` · fora desde ${fmtTime(s.down_since)}` : "";
  return `<article class="card ${s.color}" aria-label="${esc(LABEL[s.color])}: ${esc(s.url)}">
    <div class="light" aria-hidden="true"><span class="lamp r"></span><span class="lamp y"></span><span class="lamp g"></span></div>
    <div class="body">
      <div class="top">${icon}<span class="title" title="${esc(s.title||s.host)}">${esc(s.title || s.host)}</span>
        <span class="badge ${s.env==="Homologação"?"hmg":"prod"}">${s.env==="Homologação"?"Homologação":"Produção"}</span></div>
      <a class="url" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//,""))}</a>
      <div class="reason">${esc((s.reasons||[]).join(" · "))}${esc(down)}</div>
      <div class="stats">
        <span>Resposta<b>${ms}</b></span>
        <span>HTTP<b>${s.http ?? "—"}</b></span>
        <span>SSL<b>${sslTxt}</b></span>
        <span>No ar 24h<b>${s.uptime_24h ?? "—"}%</b></span>
      </div>
      <div class="hist" aria-label="Histórico das últimas checagens">${bars}</div>
      <div class="histlbl"><span>~5 h atrás</span><span>agora</span></div>
    </div>
  </article>`;
}

function render(){
  const d = state.data; if(!d) return;
  const gen = new Date(d.generated_at);
  const stale = (Date.now() - gen) > 25*60*1000;
  document.getElementById("updated").innerHTML =
    `Última checagem: <b>${fmtTime(d.generated_at)}</b> (${ago(d.generated_at)})` +
    (stale ? ` · <span class="stale">dados atrasados, o verificador pode estar parado</span>` : "");
  for (const c of ["green","yellow","red"]) {
    document.getElementById("n-"+c).textContent = d.counts[c];
    document.querySelector(`.sum[data-color="${c}"]`).classList.toggle("zero", !d.counts[c]);
    document.querySelector(`.sum[data-color="${c}"]`).classList.toggle("active", state.color === c);
  }
  const red = d.counts.red, yel = d.counts.yellow;
  document.title = (red ? `🔴 ${red} fora · ` : yel ? `🟡 ${yel} atenção · ` : "🟢 ") + "Semáforo dos Clientes";

  const q = state.q.toLowerCase();
  const sites = d.sites.filter(s =>
    (!state.color || s.color === state.color) &&
    (!state.env || s.env === state.env) &&
    (!q || (s.client+" "+s.url+" "+(s.title||"")).toLowerCase().includes(q)));
  const groups = {};
  for (const s of sites) (groups[s.client] ||= []).push(s);
  const names = Object.keys(groups).sort((a,b) => {
    const wa = Math.min(...groups[a].map(s=>ORDER[s.color])), wb = Math.min(...groups[b].map(s=>ORDER[s.color]));
    return wa - wb || a.localeCompare(b);
  });
  document.getElementById("list").innerHTML = names.length ? names.map(n => {
    const list = groups[n].sort((a,b) => ORDER[a.color]-ORDER[b.color] || (a.env>b.env?-1:1));
    const mini = list.map(s => `<i style="background:var(--${s.color})"></i>`).join("");
    return `<section class="client"><h2>${esc(n)} <span class="mini">${mini}</span></h2><div class="grid">${list.map(card).join("")}</div></section>`;
  }).join("") : `<div class="empty">Nenhum site com esse filtro.</div>`;
}

async function load(){
  try{
    const r = await fetch("data/status.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    state.data = await r.json(); render();
  }catch(e){
    if(!state.data) document.getElementById("list").innerHTML = `<div class="empty">Ainda não há dados. A primeira checagem aparece aqui em alguns minutos.</div>`;
  }
}

document.querySelectorAll(".sum").forEach(b => b.onclick = () => { state.color = state.color === b.dataset.color ? "" : b.dataset.color; render(); });
document.querySelectorAll("#envf .chip").forEach(b => b.onclick = () => {
  state.env = b.dataset.env;
  document.querySelectorAll("#envf .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("theme", next); }catch(e){}
};
load(); setInterval(load, 60000); setInterval(render, 30000);
</script>
</body>
</html>
