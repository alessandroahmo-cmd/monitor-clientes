name: Monitorar sites

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar sites
        env:
          PREVIOUS_STATUS_URL: ${{ steps.pages.outputs.base_url }}/data/status.json
          PANEL_URL: ${{ steps.pages.outputs.base_url }}/
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Às vezes o GitHub ainda não "enxerga" o pacote recém-enviado.
      # Por isso tentamos publicar até 3 vezes, esperando entre as tentativas.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40

      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
