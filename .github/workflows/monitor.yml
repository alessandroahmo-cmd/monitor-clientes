name: Monitorar sites

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["links_clientes.txt", "check.py", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar sites
        env:
          PREVIOUS_STATUS_URL: ${{ steps.pages.outputs.base_url }}/data/status.json
          PANEL_URL: ${{ steps.pages.outputs.base_url }}/
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
